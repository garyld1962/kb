[project]
name = "kb"
version = "0.1.0"
description = "Personal knowledge base CLI + server over an Obsidian vault"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "watchdog>=4",
]

[project.scripts]
kb = "kb.cli.main:app"
kb-server = "kb.server.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
markers = ["e2e: manual-only, requires live the GPU host services"]
addopts = "-m 'not e2e'"
